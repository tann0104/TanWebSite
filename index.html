<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>わたしの作品おやつ箱 🍡</title>
    <!-- Tailwind CSSの読み込み -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- 独自のスタイルシート -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="min-h-screen py-10 px-4">

    <div class="max-w-4xl mx-auto">
        <!-- ヘッダータイトル ＆ 管理者用追加ボタン -->
        <header class="text-center mb-10 flex flex-col md:flex-row items-center justify-center gap-4">
            <div>
                <h1 class="text-3xl font-bold text-pink-400 mb-2">✨ わたしの作品おやつ箱 ✨</h1>
                <p class="text-sm text-gray-500">作ったゲームやチャットを可愛くまとめたよ</p>
            </div>
            <!-- 管理者モードの時だけ表示される追加ボタン -->
            <button id="openFormBtn" class="hidden px-4 py-2 bg-pink-400 hover:bg-pink-500 text-white rounded-full font-bold text-xs shadow-md transition transform hover:scale-105 cursor-pointer">
                ➕ 作品を追加
            </button>
        </header>

        <!-- 検索・フィルターエリア -->
        <div class="bg-white/85 backdrop-blur p-6 rounded-3xl shadow-sm mb-8 border border-pink-100 flex flex-col md:flex-row gap-4 justify-between items-center">
            <!-- 検索窓 -->
            <input 
                type="text" 
                id="searchInput" 
                placeholder="キーワードでさがす..." 
                class="w-full md:w-72 px-4 py-2 rounded-full border border-pink-200 focus:outline-none focus:ring-2 focus:ring-pink-300 text-sm bg-pink-50/30"
            >
            <!-- タグフィルターボタンが表示される場所 -->
            <div id="tagFilters" class="flex flex-wrap gap-2 justify-center">
                <button class="tag-btn px-4 py-1.5 rounded-full text-xs font-bold bg-pink-400 text-white shadow-sm transition" data-tag="all">すべて</button>
            </div>
        </div>

        <!-- 作品カード一覧が表示される場所 -->
        <div id="siteList" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6 mb-12">
            <!-- JavaScriptでここにカードが差し込まれます -->
        </div>
    </div>

    <!-- 🔒 管理者用パスワード入力モーダル -->
    <div id="passwordModal" class="hidden fixed inset-0 bg-black/40 backdrop-blur-sm flex items-center justify-center z-50 p-4">
        <div class="bg-white rounded-3xl p-6 max-w-sm w-full shadow-xl border border-pink-100 text-center">
            <h3 class="text-lg font-bold text-pink-400 mb-2">🔒 管理者認証</h3>
            <p class="text-xs text-gray-500 mb-4">合言葉を入力してください</p>
            <form id="passwordForm" class="flex flex-col gap-3">
                <input type="password" id="inputPassword" placeholder="パスワード" required class="px-4 py-2 rounded-full border border-pink-200 focus:outline-none focus:ring-2 focus:ring-pink-300 text-sm bg-pink-50/30 text-center">
                <button type="submit" class="py-2 bg-pink-400 hover:bg-pink-500 text-white rounded-full font-bold text-xs transition">ログイン</button>
            </form>
        </div>
    </div>

    <!-- 💖 作品追加フォーム用モーダル -->
    <div id="formModal" class="hidden fixed inset-0 bg-black/40 backdrop-blur-sm flex items-center justify-center z-50 p-4">
        <div class="bg-white/95 backdrop-blur p-6 rounded-3xl shadow-xl border border-pink-100 max-w-md w-full relative">
            <button id="closeFormBtn" class="absolute top-4 right-4 text-gray-400 hover:text-gray-600 font-bold text-sm cursor-pointer">✕</button>
            <h2 class="text-xl font-bold text-pink-400 mb-4 text-center">💖 新しい作品を追加する</h2>
            <form id="addSiteForm" class="flex flex-col gap-3">
                <input type="text" id="newTitle" placeholder="作品のタイトル（例: ねこちゃんパズル）" required class="px-4 py-2 rounded-full border border-pink-200 focus:outline-none focus:ring-2 focus:ring-pink-300 text-sm bg-pink-50/30">
                <input type="text" id="newDescription" placeholder="簡単な説明" class="px-4 py-2 rounded-full border border-pink-200 focus:outline-none focus:ring-2 focus:ring-pink-300 text-sm bg-pink-50/30">
                <input type="url" id="newUrl" placeholder="サイトのURL（例: https://...）" required class="px-4 py-2 rounded-full border border-pink-200 focus:outline-none focus:ring-2 focus:ring-pink-300 text-sm bg-pink-50/30">
                <input type="url" id="newThumbnail" placeholder="サムネイル画像のURL（例: https://...）" class="px-4 py-2 rounded-full border border-pink-200 focus:outline-none focus:ring-2 focus:ring-pink-300 text-sm bg-pink-50/30">
                <input type="text" id="newTags" placeholder="タグ（例: ゲーム, チャット ※カンマ区切り）" class="px-4 py-2 rounded-full border border-pink-200 focus:outline-none focus:ring-2 focus:ring-pink-300 text-sm bg-pink-50/30">
                
                <button type="submit" class="mt-2 py-2 bg-pink-400 hover:bg-pink-500 text-white rounded-full font-bold text-sm transition shadow-sm cursor-pointer">
                    追加する ✨
                </button>
            </form>
        </div>
    </div>

    <!-- Supabaseクライアントの読み込み -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- 独自のJavaScript -->
    <script src="script.js"></script>
</body>
</html>
